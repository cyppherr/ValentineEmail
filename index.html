<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", system-ui, -apple-system;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ffd6e0, #ff8fab);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ❤️ Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 18px;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) scale(1.6);
        opacity: 0;
      }
    }

    /* 💌 First dialog card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      padding: 34px 28px 30px;
      border-radius: 30px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      text-align: center;
      width: min(92vw, 400px);
      animation:
        popIn 0.7s ease,
        floatCard 6s ease-in-out infinite;
      transition: transform 0.3s ease;
    }

    /* Subtle floating */
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Tiny tilt on hover */
    .card:hover {
      transform: translateY(-10px) rotateX(2deg) rotateY(-2deg);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .card h1 {
      margin: 0 0 26px;
      font-size: 24px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .buttons button {
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      min-width: 120px;
      transition: all 0.25s ease;
    }

    /* ❤️ YES BUTTON */
    #yesBtn {
      background: linear-gradient(135deg, #ff4d6d, #ff8fab);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
      animation: heartbeat 1.8s infinite;
    }

    /* Heartbeat pulse */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.08); }
      70% { transform: scale(1); }
    }

    #yesBtn:hover {
      transform: scale(1.12);
      box-shadow: 0 16px 34px rgba(255, 77, 109, 0.6);
    }

    /* 🙃 NO BUTTON */
    #noBtn {
      background: #f1f1f1;
      color: #555;
      position: relative;
    }

    /* 🌙 Overlay popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .popup {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      width: min(94vw, 460px);
      max-height: 92vh;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.4);
      text-align: center;
      overflow: auto;
      animation: popupReveal 0.6s ease;
    }

    @keyframes popupReveal {
      from {
        transform: translateY(30px) scale(0.95);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .photo-wrapper {
      width: 100%;
      margin-bottom: 18px;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 20px;
      animation: softReveal 1.2s ease forwards;
    }

    @keyframes softReveal {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup h2 {
      margin: 12px 0;
      font-size: 22px;
    }

    .typewriter {
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <!-- 💌 First dialog -->
  <div class="card">
    <h1>Will you be my Valentine? 💌</h1>
    <div class="buttons">
      <button id="yesBtn" onclick="showPopup()">Yes 💕</button>
      <button id="noBtn">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseenter", () => {
      const x = Math.random() * 140 - 70;
      const y = Math.random() * 40 - 20;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function showPopup() {
      const overlay = document.createElement("div");
      overlay.className = "overlay";

      overlay.innerHTML = `
        <div class="popup">
          <div class="photo-wrapper">
            <img src="./image.jpeg" alt="Us ❤️">
          </div>
          <h2>YAY!!! 💕</h2>
          <div class="typewriter" id="text"></div>
        </div>
      `;

      document.body.appendChild(overlay);
      startHearts();

      typeText(
        "I love you, Kuku 💖\nAnd now you’re officially stuck with me 😌\nLet’s go to Udaipur, shonu puttar 🙈",
        document.getElementById("text")
      );
    }

    function typeText(text, el) {
      let i = 0;
      const speed = 35;
      (function type() {
        if (i < text.length) {
          el.innerHTML += text.charAt(i++);
          setTimeout(type, speed);
        }
      })();
    }

    function startHearts() {
      const interval = setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = Math.random() * 2 + 3 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, 260);

      setTimeout(() => clearInterval(interval), 6000);
    }
  </script>

</body>
</html>
