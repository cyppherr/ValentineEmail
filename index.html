<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Question box */
    .question-box {
      background: white;
      padding: 28px 24px;
      border-radius: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: min(90vw, 380px);
    }

    .question-box h1 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .buttons {
      position: relative;
      height: 60px;
    }

    button {
      padding: 10px 22px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #ddd;
      color: #333;
      position: absolute;
      right: 0;
    }

    /* Overlay popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .popup {
      background: white;
      width: min(94vw, 440px);
      max-height: 92vh;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      overflow: auto;
      animation: popupIn 0.6s ease;
    }

    @keyframes popupIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .photo-wrapper {
      width: 100%;
      margin-bottom: 16px;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 16px;
      display: block;
      animation: softReveal 1.2s ease-out forwards;
    }

    @keyframes softReveal {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup h1 {
      margin: 12px 0;
      font-size: 22px;
    }

    .typewriter {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="question-box">
    <h1>Will you be my Valentine? 💌</h1>
    <div class="buttons">
      <button id="yesBtn" onclick="showPopup()">Yes 💕</button>
      <button id="noBtn">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseenter", () => {
      const x = Math.random() * 160 - 80;
      const y = Math.random() * 40 - 20;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function showPopup() {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
  
    overlay.innerHTML = `
      <div class="popup">
        <div class="photo-wrapper">
          <img src="./image.jpeg" alt="Us ❤️" loading="eager">
        </div>
        <h1>YAY!!! 💕</h1>
        <div class="typewriter" id="text"></div>
      </div>
    `;
  
    document.body.appendChild(overlay);
  
    typeText(
      "I love you, Kuku 💖\nAnd now you’re officially stuck with me 😌\nLet’s go to Udaipur, get lost, laugh a lot,\nand make memories we’ll keep teasing each other about forever ✨",
      document.getElementById("text")
    );
  }


    function typeText(text, element) {
      let i = 0;
      const speed = 35;

      function typing() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, speed);
        }
      }

      typing();
    }
  </script>

</body>
</html>
