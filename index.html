<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>

  <!-- Cute Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e8, #fff1f6);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Floating hearts */
    body::before {
      content: "💗 💕 💖 💘 💝";
      position: absolute;
      font-size: 40px;
      opacity: 0.15;
      animation: float 12s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); }
      100% { transform: translateY(-120vh); }
    }

    .modal {
      background: #ffffff;
      padding: 40px 45px;
      border-radius: 28px;
      text-align: center;
      width: 360px;
      box-shadow: 0 30px 60px rgba(255, 105, 135, 0.35);
      animation: pop 0.7s ease;
      position: relative;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .heart {
      font-size: 48px;
      animation: heartbeat 1.6s infinite;
      margin-bottom: 12px;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.3); }
      60% { transform: scale(1); }
    }

    h1 {
      color: #ff4d88;
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: #777;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 70px;
    }

    button {
      padding: 12px 32px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      position: absolute;
      transition: all 0.25s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff5f9e, #ff85b3);
      color: white;
      left: 35px;
      box-shadow: 0 10px 20px rgba(255, 95, 158, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.15);
    }

    #noBtn {
      background: #f3f3f3;
      color: #888;
      right: 35px;
    }

    /* Final screen */
    .final-screen {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e8, #fff1f6);
      animation: fade 1s ease;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .final-box {
      background: white;
      padding: 45px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(255, 105, 135, 0.35);
    }

    .final-box h1 {
      font-size: 46px;
      color: #ff4d88;
      margin-bottom: 15px;
    }

    .final-box p {
      font-size: 22px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="modal">
    <div class="heart">💖</div>
    <h1>Will you be my Valentine?</h1>
    <p>You make my heart smile every day.</p>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💕</button>
      <button id="noBtn">No 😜</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 240 - 120;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function sayYes() {
      document.body.innerHTML = `
        <div class="final-screen">
          <div class="final-box">
            <h1>YAY!!! 💕</h1>
            <p>
              <strong>I love you, Kuku 💖</strong><br>
              Let’s make our Udaipur trip full of love,<br>
              laughter, and unforgettable memories ✨
            </p>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
