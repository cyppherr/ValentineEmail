<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .modal {
      background: white;
      padding: 35px 45px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      position: relative;
      width: 340px;
      animation: popIn 0.6s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .heart {
      font-size: 42px;
      animation: pulse 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .modal h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    .modal p {
      color: #555;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .buttons {
      position: relative;
      height: 65px;
    }

    button {
      padding: 11px 28px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      left: 35px;
    }

    #yesBtn:hover {
      background: #ff2e55;
      transform: scale(1.1);
    }

    #noBtn {
      background: #e0e0e0;
      color: #555;
      right: 35px;
    }

    .final-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .final-box h1 {
      color: #ff2e55;
      font-size: 48px;
      margin-bottom: 15px;
    }

    .final-box p {
      font-size: 22px;
      color: #444;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="modal">
    <div class="heart">❤️</div>
    <h1>Will you be my Valentine?</h1>
    <p>You make my world brighter every single day.</p>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 220 - 110;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function sayYes() {
      document.body.innerHTML = `
        <div class="final-screen">
          <div class="final-box">
            <h1>YAY!!! 💕</h1>
            <p>
              <strong>I love you, Kuku 💖</strong><br>
              Let’s make our Udaipur trip full of love, laughter,<br>
              and unforgettable memories ✨
            </p>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
